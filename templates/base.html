<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.club_name }}{% endblock %} — {{ site.school }}</title>
<meta name="description" content="{{ site.tagline }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
{{ stylesheet }}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap">
    <p class="eyebrow">{{ site.school }}, est. {{ site.founded }}</p>
    <h1><a href="{{ base }}index.html">{{ site.club_name }}</a></h1>
    <p class="tagline">{{ site.tagline }}</p>
    <nav class="pages" aria-label="Pages">
      <a href="{{ base }}index.html" {% if page=='home' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ base }}about.html" {% if page=='about' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ base }}schedule.html" {% if page=='schedule' %}aria-current="page"{% endif %}>Schedule</a>
      <a href="{{ base }}archive.html" {% if page=='archive' %}aria-current="page"{% endif %}>Archive</a>
      <a href="{{ base }}join.html" {% if page=='join' %}aria-current="page"{% endif %}>Join</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>

<footer>
  <div class="wrap">
    <p>{{ site.club_name }}, {{ site.school }} — {{ site.year }}</p>
    <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  </div>
</footer>

</body>
</html>
